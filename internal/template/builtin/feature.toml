name        = "feature"
description = "Standard feature implementation with test verification and acceptance testing"
entry       = "acceptance_spec"
auto_merge  = true

[steps.acceptance_spec]
type        = "agent"
role        = "acceptance-author"
max_retries = 2
on_success  = "implement"
on_failure  = "acceptance_spec"

[steps.implement]
type        = "agent"
role        = "implementer"
max_retries = 5
on_success  = "lint"
on_failure  = "implement"

[steps.lint]
type       = "deterministic"
command    = "clankwork"
args       = ["verify", "lint"]
on_success = "typecheck"
on_failure = "implement"

[steps.typecheck]
type       = "deterministic"
command    = "clankwork"
args       = ["verify", "typecheck"]
on_success = "test"
on_failure = "implement"

[steps.test]
type       = "deterministic"
command    = "clankwork"
args       = ["verify"]
on_success = "acceptance"
on_failure = "implement"

[steps.acceptance]
type        = "agent"
role        = "acceptance"
max_retries = 3
on_success  = "complete"
on_failure  = "implement"
